<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-label="ScienceGlimpse Quick Draw Ladder">
  <defs>
    <radialGradient id="glow" cx="50%" cy="46%" r="60%">
      <stop offset="0" stop-color="#4ade80" stop-opacity="0.35"/>
      <stop offset="0.55" stop-color="#4ade80" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#4ade80" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d2341"/>
      <stop offset="1" stop-color="#07152e"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="720" fill="#050f22"/>
  <rect width="1280" height="720" fill="url(#glow)"/>

  <!-- The ladder: rungs climbing to the right -->
  <g font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-weight="800">
    <rect x="884" y="96" width="300" height="76" rx="18" fill="url(#panel)" stroke="#f6c65c" stroke-opacity="0.6" stroke-width="3"/>
    <text x="912" y="146" font-size="30" fill="#f6c65c">#1</text>
    <text x="1160" y="146" font-size="30" fill="#eef7ff" text-anchor="end">187 ms</text>

    <rect x="884" y="196" width="300" height="76" rx="18" fill="url(#panel)" stroke="#bcdef7" stroke-opacity="0.2" stroke-width="2"/>
    <text x="912" y="246" font-size="30" fill="#7e9ab1">#2</text>
    <text x="1160" y="246" font-size="30" fill="#eef7ff" text-anchor="end">203 ms</text>

    <rect x="884" y="296" width="300" height="76" rx="18" fill="url(#panel)" stroke="#4ade80" stroke-opacity="0.8" stroke-width="3"/>
    <text x="912" y="346" font-size="30" fill="#4ade80">#3</text>
    <text x="1160" y="346" font-size="30" fill="#4ade80" text-anchor="end">YOU ▲</text>

    <rect x="884" y="396" width="300" height="76" rx="18" fill="url(#panel)" stroke="#bcdef7" stroke-opacity="0.2" stroke-width="2"/>
    <text x="912" y="446" font-size="30" fill="#7e9ab1">#4</text>
    <text x="1160" y="446" font-size="30" fill="#eef7ff" text-anchor="end">241 ms</text>
  </g>

  <!-- The DRAW! signal -->
  <g font-family="Inter, 'Segoe UI', system-ui, sans-serif" text-anchor="middle">
    <rect x="96" y="150" width="700" height="330" rx="40" fill="#4ade80"/>
    <text x="446" y="365" font-size="170" font-weight="900" fill="#052e16" letter-spacing="-6">DRAW!</text>

    <text x="446" y="590" font-size="92" font-weight="900" fill="#ffffff" letter-spacing="-3">214 ms</text>
    <text x="446" y="646" font-size="30" font-weight="800" fill="#78c9ee" letter-spacing="6">QUICK DRAW LADDER</text>
  </g>

  <!-- Five draw pips -->
  <g font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-weight="800" font-size="24" text-anchor="middle">
    <rect x="884" y="520" width="52" height="44" rx="10" fill="none" stroke="#4ade80" stroke-width="2"/>
    <text x="910" y="550" fill="#4ade80">✓</text>
    <rect x="946" y="520" width="52" height="44" rx="10" fill="none" stroke="#4ade80" stroke-width="2"/>
    <text x="972" y="550" fill="#4ade80">✓</text>
    <rect x="1008" y="520" width="52" height="44" rx="10" fill="none" stroke="#fbbf24" stroke-width="2"/>
    <text x="1034" y="550" fill="#fbbf24">✕</text>
    <rect x="1070" y="520" width="52" height="44" rx="10" fill="none" stroke="#4ade80" stroke-width="2"/>
    <text x="1096" y="550" fill="#4ade80">✓</text>
    <rect x="1132" y="520" width="52" height="44" rx="10" fill="none" stroke="#bcdef7" stroke-opacity="0.3" stroke-width="2"/>
    <text x="1158" y="550" fill="#7e9ab1">5</text>
  </g>
</svg>
